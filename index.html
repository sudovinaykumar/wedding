<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e8de">
<title>Rachana &amp; Vinay — Wedding Invitation</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#f7e8de;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
#invitation{width:100%;height:100vh;height:100svh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-snap-stop:normal;scroll-behavior:smooth;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#invitation::-webkit-scrollbar{display:none}
.page{position:relative;width:100%;height:100vh;height:100svh;min-height:100vh;min-height:100svh;max-height:100vh;max-height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center;scroll-snap-align:start;scroll-snap-stop:normal;background:#f7e8de}
.page-art{display:block;width:auto;height:92%;max-width:none;object-fit:contain;object-position:center;margin:0;padding:0;border:0;pointer-events:none;user-select:none;-webkit-user-drag:none;transform:scale(.88);opacity:.72;transform-origin:center;transition:transform 700ms cubic-bezier(.22,.61,.36,1),opacity 700ms cubic-bezier(.22,.61,.36,1);will-change:transform,opacity}
.page.active .page-art{transform:scale(1.08);opacity:1}
.map-hit{position:absolute;left:35.6%;top:86.1%;width:32.2%;height:4.6%;display:block;background:transparent;border:0;outline:0!important;-webkit-tap-highlight-color:transparent;cursor:pointer;touch-action:manipulation}
.page2-art-wrap{position:relative;display:inline-flex;height:92%;transform:scale(.88);opacity:.72;transform-origin:center;transition:transform 700ms cubic-bezier(.22,.61,.36,1),opacity 700ms cubic-bezier(.22,.61,.36,1)}
.page2-art-wrap .page-art{height:100%;width:auto;max-width:none;transform:none;opacity:1;transition:none}
.page.active .page2-art-wrap{transform:scale(1.08);opacity:1}
.page.active .page2-art-wrap .page-art{transform:none;opacity:1}
.scroll-hint,.opening-tap{display:flex;align-items:center;justify-content:center;min-width:90px;padding:5px 10px;border:1px solid rgba(255,255,255,.68);border-radius:999px;letter-spacing:.14em;font:8px/1 Arial,sans-serif;white-space:nowrap}
.scroll-hint{position:absolute;z-index:30;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:transparent;color:#75665d;pointer-events:none;opacity:0;transition:opacity .4s ease}
.page.active .scroll-hint{opacity:1}
body[data-scroll-dir="up"] .scroll-hint{opacity:0!important}
#opening{position:fixed;inset:0;z-index:2000;overflow:hidden;background:#f4ded2;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer;opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}
#opening.entered{opacity:0;visibility:hidden;pointer-events:none}
.opening-art{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;object-position:center;transform:translate(-50%,-50%);display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.opening-hit{position:absolute;inset:0;z-index:10;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opening-tap{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:transparent;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.28);pointer-events:none}
@media(max-width:699px){.page-art{height:92%;transform:scale(.90)}.page.active .page-art{transform:scale(1.12)}#page3 .page-art{filter:drop-shadow(0 0 1px rgba(105,83,70,.10))}#page3.active .page-art{transform:scale(1.08)}.page2-art-wrap{transform:scale(.90)}.page.active .page2-art-wrap{transform:scale(1.12)}}
@media(min-width:700px){.page-art{width:100%;height:100%;object-fit:contain;transform:scale(.88)}.page.active .page-art{transform:scale(1.08)}.scroll-hint{display:flex}
.page2-art-wrap{height:100%}
#opening,#invitation{position:fixed;left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(430px,94vw);height:min(920px,94dvh);border-radius:18px;box-shadow:0 30px 90px rgba(60,40,20,.30),0 0 0 1px rgba(60,40,20,.06);overflow:hidden}
#invitation{overflow-y:auto}
.page{height:100%;min-height:100%;max-height:100%}
body{background:#ece0d2}
}
@media(prefers-reduced-motion:reduce){#invitation{scroll-behavior:auto}.page-art,#opening,.scroll-hint{transition:none}}
</style>
</head>
<body>

<audio id="weddingMusic" preload="none" loop>

</audio>
<div id="opening" role="button" tabindex="0" aria-label="Open wedding invitation">
<img class="opening-art" src="opening.png" alt="">
<button class="opening-hit" type="button" aria-label="Tap anywhere to open invitation">
<span class="opening-tap" aria-hidden="true">SCROLL DOWN</span>
</button>
</div>
<main id="invitation">
<section class="page" id="page1">
<img class="page-art" src="page1.png" alt="Rachana and Vinay wedding invitation" decoding="async">
<div class="scroll-hint" aria-hidden="true">SCROLL DOWN</div>
</section>
<section class="page" id="page2">
<div class="page2-art-wrap">
<img class="page-art" src="page2.png" alt="Wedding ceremony, reception and venue details" decoding="async">
<a class="map-hit" href="https://www.google.com/maps/search/?api=1&amp;query=GNR%20Kalyana%20Mantapa%2C%20Jayanagar%2C%20Bengaluru" target="_blank" rel="noopener noreferrer" aria-label="View Location — open in Google Maps"></a>
</div>
<div class="scroll-hint" aria-hidden="true">SCROLL DOWN</div>
</section>
<section class="page" id="page3">
<img class="page-art" src="page3.png" alt="With Love — Rachana and Vinay Kumar" decoding="async">
</section>
</main>

<script>
(function(){
"use strict";
const opening=document.getElementById("opening");
const invitation=document.getElementById("invitation");
const pages=[...document.querySelectorAll(".page")];
const hit=opening.querySelector(".opening-hit");
const music=document.getElementById("weddingMusic");
let entered=false, returning=false;
let lastScrollTop=0;
let wasPlayingBeforeHide=false;
let musicStarted=false;
document.body.dataset.scrollDir="down";
function startMusic(){
if(musicStarted)return;
try{
  if(!music.querySelector("source")){
    const source=document.createElement("source");
    source.src="thousand_years.mp3";
    source.type="audio/mpeg";
    music.appendChild(source);
    music.load();
  }
  music.volume=0.65;
  const playPromise=music.play();
  if(playPromise!==undefined){
    playPromise.then(()=>{musicStarted=true;}).catch(()=>{});
  }else{
    musicStarted=true;
  }
}catch(e){}
}
function enter(event){
if(event){event.preventDefault();event.stopPropagation();}
if(entered||returning)return;
entered=true;
startMusic();
opening.classList.add("entered");
invitation.scrollTo({top:0,left:0,behavior:"auto"});
lastScrollTop=0;
document.body.dataset.scrollDir="down";
pages.forEach((page,i)=>page.classList.toggle("active",i===0));
}
opening.addEventListener("click",enter);
opening.addEventListener("touchend",enter,{passive:false});
opening.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" ")enter(event);});
hit.addEventListener("click",enter);
hit.addEventListener("touchend",enter,{passive:false});
opening.addEventListener("wheel",event=>{enter(event);},{passive:false});
let openingTouchStartY=null;
opening.addEventListener("touchstart",event=>{openingTouchStartY=event.touches[0].clientY;},{passive:true});
opening.addEventListener("touchmove",event=>{
if(openingTouchStartY===null)return;
const dy=Math.abs(event.touches[0].clientY-openingTouchStartY);
if(dy>10){enter(event);openingTouchStartY=null;}
},{passive:false});
document.addEventListener("click",startMusic);
document.addEventListener("touchstart",startMusic,{passive:true});
document.addEventListener("keydown",startMusic);
document.addEventListener("wheel",startMusic,{passive:true});

const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>entry.target.classList.toggle("active",entry.isIntersecting&&entry.intersectionRatio>=.5));
},{root:invitation,threshold:[.5,.8,1]});
pages.forEach(page=>observer.observe(page));
invitation.addEventListener("scroll",()=>{
const st=invitation.scrollTop;
if(st>lastScrollTop)document.body.dataset.scrollDir="down";
else if(st<lastScrollTop)document.body.dataset.scrollDir="up";
lastScrollTop=st;
},{passive:true});
function returnToOpening(){
if(!entered||returning)return;
if(invitation.scrollTop>0)return;
if(!pages[0].classList.contains("active"))return;
returning=true;
opening.style.display="block";
opening.classList.remove("entered");
requestAnimationFrame(()=>requestAnimationFrame(()=>{
entered=false;returning=false;
}));
}
invitation.addEventListener("wheel",event=>{
if(invitation.scrollTop<=0&&event.deltaY<-8)returnToOpening();
},{passive:true});
let touchStartY=null;
invitation.addEventListener("touchstart",event=>{
touchStartY=event.touches[0].clientY;
},{passive:true});
invitation.addEventListener("touchmove",event=>{
if(touchStartY===null)return;
const dy=event.touches[0].clientY-touchStartY;
if(invitation.scrollTop<=0&&dy>40){
returnToOpening();
touchStartY=null;
}
},{passive:true});
invitation.addEventListener("touchend",()=>{touchStartY=null;},{passive:true});
document.addEventListener("visibilitychange",()=>{
if(document.hidden){
wasPlayingBeforeHide=!music.paused;
if(!music.paused)music.pause();
}else{
if(wasPlayingBeforeHide)music.play().catch(()=>{});
}
});
})();
</script>
</body>
</html>
