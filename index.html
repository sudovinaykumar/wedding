<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e8de">
<title>Rachana &amp; Vinay — Wedding Invitation</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#f7e8de;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
#invitation{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden}
.page{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f7e8de;opacity:0;pointer-events:none;transition:opacity 700ms cubic-bezier(.22,.61,.36,1)}
.page.active{opacity:1;pointer-events:auto;z-index:1}
.page.dragging{transition:none}
.page-art{display:block;width:auto;height:92%;max-width:none;object-fit:contain;object-position:center;margin:0;padding:0;border:0;pointer-events:none;user-select:none;-webkit-user-drag:none;transform:scale(.88);opacity:.72;transform-origin:center;transition:transform 700ms cubic-bezier(.22,.61,.36,1),opacity 700ms cubic-bezier(.22,.61,.36,1);will-change:transform,opacity}
.page.active .page-art{transform:scale(1.08);opacity:1}
.map-hit{position:absolute;left:35.6%;top:86.1%;width:32.2%;height:4.6%;display:block;background:transparent;border:0;outline:0!important;-webkit-tap-highlight-color:transparent;cursor:pointer;touch-action:manipulation}
.map-overlay{position:absolute;inset:0;z-index:50;background:rgba(20,14,10,.55);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 250ms ease}
.map-overlay.open{opacity:1;pointer-events:auto}
.map-overlay-inner{position:relative;width:88%;height:70%;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.map-overlay-inner iframe{border:0;flex:1;width:100%}
.map-overlay-close{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:20px;line-height:1;cursor:pointer;z-index:2}
.map-overlay-directions{display:block;text-align:center;padding:13px;background:#f7e8de;color:#5b4636;text-decoration:none;font:600 12px/1 Arial,sans-serif;letter-spacing:.08em}
.page2-art-wrap{position:relative;display:inline-flex;height:92%;transform:scale(.88);opacity:.72;transform-origin:center;transition:transform 700ms cubic-bezier(.22,.61,.36,1),opacity 700ms cubic-bezier(.22,.61,.36,1)}
.page2-art-wrap .page-art{height:100%;width:auto;max-width:none;transform:none;opacity:1;transition:none}
.page.active .page2-art-wrap{transform:scale(1.08);opacity:1}
.page.active .page2-art-wrap .page-art{transform:none;opacity:1}
.scroll-hint{display:flex;align-items:center;justify-content:center;min-width:90px;padding:5px 10px;border:1px solid rgba(255,255,255,.68);border-radius:999px;letter-spacing:.14em;font:8px/1 Arial,sans-serif;white-space:nowrap;position:absolute;z-index:30;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);background:transparent;color:#75665d;pointer-events:none;opacity:0;transition:opacity .4s ease}
.page.active .scroll-hint{opacity:1}
body[data-scroll-dir="up"] .scroll-hint{opacity:0!important}
body[data-scroll-dir="up"] #opening.active .scroll-hint{opacity:1!important}
#opening{background:#f4ded2}
.opening-art{display:block;width:100%;height:100%;object-fit:cover;object-position:center;margin:0;padding:0;border:0;pointer-events:none;user-select:none;-webkit-user-drag:none}
#opening .scroll-hint{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.28)}
@media(max-width:699px){.page-art{height:92%;transform:scale(.90)}.page.active .page-art{transform:scale(1.12)}#page3 .page-art{filter:drop-shadow(0 0 1px rgba(105,83,70,.10))}#page3.active .page-art{transform:scale(1.08)}.page2-art-wrap{transform:scale(.90)}.page.active .page2-art-wrap{transform:scale(1.12)}}
@media(min-width:700px),(min-aspect-ratio:3/4){.page-art{width:100%;height:100%;object-fit:contain;transform:scale(.88)}.page.active .page-art{transform:scale(1.08)}.scroll-hint{display:flex}
.page2-art-wrap{height:100%}
#invitation{position:fixed;left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(430px,94vw);height:min(920px,94dvh);border-radius:18px;box-shadow:0 30px 90px rgba(60,40,20,.30),0 0 0 1px rgba(60,40,20,.06)}
body{background:#ece0d2}
}
@media(prefers-reduced-motion:reduce){.page,.page-art,.scroll-hint{transition:none}}
</style>
</head>
<body>

<audio id="weddingMusic" preload="none" loop>

</audio>
<main id="invitation">
<section class="page active" id="opening">
<img class="opening-art" src="opening.png" alt="">
<div class="scroll-hint" aria-hidden="true">SCROLL DOWN</div>
</section>
<section class="page" id="page1">
<img class="page-art" src="page1.png" alt="Rachana and Vinay wedding invitation" decoding="async">
<div class="scroll-hint" aria-hidden="true">SCROLL DOWN</div>
</section>
<section class="page" id="page2">
<div class="page2-art-wrap">
<img class="page-art" src="page2.png" alt="Wedding ceremony, reception and venue details" decoding="async">
<a class="map-hit" href="https://www.google.com/maps/search/?api=1&amp;query=GNR%20Kalyana%20Mantapa%2C%20Jayanagar%2C%20Bengaluru" aria-label="View Location — open in Google Maps"></a>
</div>
<div class="scroll-hint" aria-hidden="true">SCROLL DOWN</div>
</section>
<section class="page" id="page3">
<img class="page-art" src="page3.png" alt="With Love — Rachana and Vinay Kumar" decoding="async">
</section>
<div id="mapOverlay" class="map-overlay" aria-hidden="true">
<div class="map-overlay-inner">
<button type="button" class="map-overlay-close" aria-label="Close map">&times;</button>
<iframe id="mapOverlayFrame" title="Venue location" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
<a id="mapOverlayDirections" class="map-overlay-directions" target="_blank" rel="noopener" href="#">GET DIRECTIONS</a>
</div>
</div>
</main>

<script>
(function(){
"use strict";
const invitation=document.getElementById("invitation");
const pages=[...document.querySelectorAll(".page")];
const music=document.getElementById("weddingMusic");
let currentIndex=0;
let transitioning=false;
let musicStarted=false;
document.body.dataset.scrollDir="down";

(function setupMapHandling(){
const mapAnchor=document.querySelector(".map-hit");
const overlay=document.getElementById("mapOverlay");
if(!mapAnchor||!overlay)return;
const ua=navigator.userAgent||"";
const isNonSafariIOSBrowser=/CriOS|FxiOS|EdgiOS|OPiOS|mercury/i.test(ua);
if(!isNonSafariIOSBrowser)return;

const query="GNR%20Kalyana%20Mantapa%2C%20Jayanagar%2C%20Bengaluru";
const frame=document.getElementById("mapOverlayFrame");
const directionsLink=document.getElementById("mapOverlayDirections");
const closeBtn=overlay.querySelector(".map-overlay-close");
directionsLink.href="https://www.google.com/maps/search/?api=1&query="+query;

function openOverlay(){
if(!frame.src){
frame.src="https://maps.google.com/maps?q="+query+"&output=embed";
}
overlay.classList.add("open");
overlay.setAttribute("aria-hidden","false");
}
function closeOverlay(){
overlay.classList.remove("open");
overlay.setAttribute("aria-hidden","true");
}
mapAnchor.addEventListener("click",event=>{
event.preventDefault();
openOverlay();
});
closeBtn.addEventListener("click",closeOverlay);
overlay.addEventListener("click",event=>{
if(event.target===overlay)closeOverlay();
});
})();

function startMusic(){
if(musicStarted)return;
try{
  if(!music.querySelector("source")){
    const source=document.createElement("source");
    source.src="thousand_years.mp3";
    source.type="audio/mpeg";
    music.appendChild(source);
    music.load();
  }
  music.volume=0.65;
  const playPromise=music.play();
  if(playPromise!==undefined){
    playPromise.then(()=>{musicStarted=true;}).catch(()=>{});
  }else{
    musicStarted=true;
  }
}catch(e){}
}

function showPage(i){
if(i<0||i>=pages.length||i===currentIndex)return;
document.body.dataset.scrollDir=i>currentIndex?"down":"up";
pages[currentIndex].classList.remove("active");
currentIndex=i;
pages[currentIndex].classList.add("active");
if(currentIndex>0)startMusic();
}
function safeNext(){
if(transitioning)return;
transitioning=true;
showPage(currentIndex+1);
setTimeout(()=>{transitioning=false;},750);
}
function safePrev(){
if(transitioning)return;
transitioning=true;
showPage(currentIndex-1);
setTimeout(()=>{transitioning=false;},750);
}

invitation.addEventListener("wheel",event=>{
startMusic();
if(event.deltaY>10)safeNext();
else if(event.deltaY<-10)safePrev();
},{passive:true});

const DRAG_DISTANCE=140;
let touchStartY=null;
let dragging=false;
let dragTargetIndex=null;
let isPinching=false;

function clearDragState(){
pages.forEach(p=>{p.style.opacity="";p.style.pointerEvents="";p.classList.remove("dragging");});
}

function cancelSwipeNav(){
if(dragging)clearDragState();
touchStartY=null;
dragging=false;
dragTargetIndex=null;
}

invitation.addEventListener("touchstart",event=>{
startMusic();
if(event.touches.length>1){
isPinching=true;
cancelSwipeNav();
return;
}
if(transitioning)return;
touchStartY=event.touches[0].clientY;
dragging=false;
dragTargetIndex=null;
},{passive:true});

invitation.addEventListener("touchmove",event=>{
startMusic();
if(event.touches.length>1){
isPinching=true;
cancelSwipeNav();
return;
}
if(isPinching||touchStartY===null||transitioning)return;
const currentY=event.touches[0].clientY;
const delta=touchStartY-currentY;
if(!dragging&&Math.abs(delta)>18){
const targetIdx=delta>0?currentIndex+1:currentIndex-1;
if(targetIdx<0||targetIdx>=pages.length)return;
dragging=true;
dragTargetIndex=targetIdx;
pages[currentIndex].classList.add("dragging");
pages[dragTargetIndex].classList.add("dragging");
pages[dragTargetIndex].style.pointerEvents="none";
}
if(dragging&&dragTargetIndex!==null){
const fraction=Math.min(Math.abs(delta)/DRAG_DISTANCE,1);
pages[currentIndex].style.opacity=String(1-fraction);
pages[dragTargetIndex].style.opacity=String(fraction);
}
},{passive:true});

invitation.addEventListener("touchend",event=>{
startMusic();
if(event.touches.length>0){
return;
}
if(isPinching){
isPinching=false;
cancelSwipeNav();
return;
}
if(!dragging||dragTargetIndex===null){
touchStartY=null;dragging=false;dragTargetIndex=null;
return;
}
const targetIdx=dragTargetIndex;
clearDragState();
transitioning=true;
showPage(targetIdx);
setTimeout(()=>{transitioning=false;},700);
touchStartY=null;dragging=false;dragTargetIndex=null;
},{passive:true});

document.addEventListener("keydown",event=>{
startMusic();
if(event.key==="ArrowDown"||event.key==="PageDown"){safeNext();}
else if(event.key==="ArrowUp"||event.key==="PageUp"){safePrev();}
});
document.addEventListener("click",startMusic);
document.addEventListener("touchstart",startMusic,{passive:true});

let pageIsHidden=false;
let desiredPlaying=false;
function handlePageHide(){
if(pageIsHidden)return;
pageIsHidden=true;
if(!music.paused){
desiredPlaying=true;
music.pause();
}
}
function ensurePlaying(){
if(!musicStarted&&!desiredPlaying)return;
if(!music.paused)return;
try{
music.currentTime=music.currentTime;
const p=music.play();
if(p!==undefined)p.catch(()=>{});
}catch(e){}
}
music.addEventListener("playing",()=>{
musicStarted=true;
});
music.addEventListener("pause",()=>{
if(!document.hidden&&musicStarted){
desiredPlaying=true;
}
});
function handlePageShow(){
pageIsHidden=false;
ensurePlaying();
}
document.addEventListener("visibilitychange",()=>{
if(document.hidden)handlePageHide();else handlePageShow();
});
window.addEventListener("pagehide",handlePageHide);
window.addEventListener("pageshow",handlePageShow);
document.addEventListener("click",ensurePlaying);
document.addEventListener("touchstart",ensurePlaying,{passive:true});

if("visualViewport"in window){
const resetIfZoomedOut=()=>{
if(window.visualViewport.scale<=1.02){
window.scrollTo(0,0);
}
};
window.visualViewport.addEventListener("resize",resetIfZoomedOut);
window.visualViewport.addEventListener("scroll",resetIfZoomedOut);
}
})();
</script>
</body>
</html>
