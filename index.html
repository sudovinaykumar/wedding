<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7eee7">
<title>Rachana & Vinay — Wedding</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f7eee7;overflow-x:hidden}

.page{
  min-height:100svh;
  min-height:100dvh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:max(8px,env(safe-area-inset-top))
          max(8px,env(safe-area-inset-right))
          max(8px,env(safe-area-inset-bottom))
          max(8px,env(safe-area-inset-left));
}

.art-wrap{
  position:relative;
  display:block;
  width:fit-content;
  max-width:100%;
  max-height:calc(100svh - 16px);
  max-height:calc(100dvh - 16px);
}

.art{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:calc(100svh - 16px);
  max-height:calc(100dvh - 16px);
  object-fit:contain;
  transform:scale(.955);
  opacity:.72;
  transform-origin:center center;
  transition:
    transform 1s cubic-bezier(.22,.61,.36,1),
    opacity .85s ease;
  will-change:transform,opacity;
}

.page.visible .art{
  transform:scale(1);
  opacity:1;
}

/* Exact clickable area over the "VIEW LOCATION" button in page2.png */
.location-hotspot{
  position:absolute;
  left:54.7%;
  top:79.0%;
  width:27.0%;
  height:5.0%;
  transform:translate(-50%,-50%);
  z-index:20;
  display:block;
  cursor:pointer;
  -webkit-tap-highlight-color:rgba(190,125,110,.20);
}

@media(min-width:700px){
  .page{padding:24px}
  .art-wrap,.art{
    max-height:calc(100svh - 48px);
    max-height:calc(100dvh - 48px);
  }
}

.scroll-hint{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:max(10px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  padding:7px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  font:11px/1 Arial,sans-serif;
  letter-spacing:.18em;
  color:#75665d;
  pointer-events:none;
  transition:opacity .4s ease;
}
@media(min-width:700px){.scroll-hint{display:none}}
</style>
</head>

<body>
<main>
<section class="page" id="page1">
  <div class="art-wrap">
    <img class="art" src="page1.png" alt="Rachana and Vinay wedding invitation">
  </div>
</section>

<section class="page" id="page2">
  <div class="art-wrap">
    <img class="art" src="page2.png" alt="Wedding ceremony, reception and venue details">

    <a
      class="location-hotspot"
      href="https://www.google.com/maps/search/?api=1&query=GNR%20Kalyana%20Mantapa%2C%20Jayanagar%2C%20Bengaluru"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="View GNR Kalyana Mantapa on Google Maps">
    </a>
  </div>
</section>

<section class="page" id="page3">
  <div class="art-wrap">
    <img class="art" src="page3.png" alt="A new beginning message from Rachana and Vinay">
  </div>
</section>
</main>

<div class="scroll-hint" id="scrollHint">SCROLL DOWN ↓</div>

<script>
const opening=document.getElementById("opening");
const pages=document.getElementById("pages");
const hint=document.getElementById("scrollHint");

function openInvitation(event){
  if(event){
    event.preventDefault();
    event.stopPropagation();
  }
  if(!opening || opening.classList.contains("open")) return;

  opening.classList.add("open");

  setTimeout(()=>{
    opening.remove();
    pages.scrollTo({top:0,left:0,behavior:"auto"});
  },360);
}

opening.addEventListener("click",openInvitation);
opening.addEventListener("touchend",openInvitation,{passive:false});
opening.addEventListener("keydown",(event)=>{
  if(event.key==="Enter" || event.key===" ") openInvitation(event);
});

function hideHint(){
  hint.style.opacity="0";
  setTimeout(()=>hint.style.display="none",500);
}
addEventListener("scroll",hideHint,{passive:true});
addEventListener("touchstart",hideHint,{passive:true});

/* Small -> big + fade entrance effect for Pages 1-3. */
const pageSections=document.querySelectorAll(".page");
const observer=new IntersectionObserver((entries)=>{
  entries.forEach((entry)=>{
    entry.target.classList.toggle(
      "visible",
      entry.isIntersecting && entry.intersectionRatio >= .5
    );
  });
},{threshold:[0,.5,1]});

pageSections.forEach(page=>observer.observe(page));

</script>
</body>
</html>
